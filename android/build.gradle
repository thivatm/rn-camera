ext.RnCamera = [
  minSdkVersion: 24,
  compileSdkVersion: 36
]

ext.getExtOrDefault = { prop ->
  if (rootProject.ext.has(prop)) {
    return rootProject.ext.get(prop)
  }

  return RnCamera[prop]
}


apply plugin: "com.android.library"

if (project.extensions.findByName("kotlin") == null) {
  apply plugin: "kotlin-android"
}


apply plugin: "com.facebook.react"

android {
  namespace "com.thivatm.rncamera"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  // Same OkHttp line React Native itself ships with.
  implementation "com.squareup.okhttp3:okhttp:4.9.2"

  def cameraxVersion = "1.5.0"
  implementation "androidx.camera:camera-core:$cameraxVersion"
  implementation "androidx.camera:camera-camera2:$cameraxVersion"
  implementation "androidx.camera:camera-lifecycle:$cameraxVersion"
  implementation "androidx.camera:camera-view:$cameraxVersion"
  implementation "androidx.camera:camera-video:$cameraxVersion"

  // Fragmented MP4 muxer (ADR 0002; Mux spike, ticket 01).
  def media3Version = "1.8.0"
  implementation "androidx.media3:media3-muxer:$media3Version"
  implementation "androidx.media3:media3-common:$media3Version"
  implementation "androidx.media3:media3-container:$media3Version"

  testImplementation "junit:junit:4.13.2"
  testImplementation "com.squareup.okhttp3:mockwebserver:4.9.2"

  // Instrumented tests: real MediaCodec encoders and the Media3 muxer.
  androidTestImplementation "androidx.test:runner:1.6.2"
  androidTestImplementation "androidx.test.ext:junit:1.2.1"
}
